name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -m "not integration"

  demo-api:
    name: demo-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Live DEMO public API
        run: pytest -m integration

  mark-ready:
    name: mark-ready
    needs: unit
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Mark the PR ready after green unit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          meta="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels,headRefOid)"
          current="$(echo "$meta" | jq -r '.headRefOid')"
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "stale event head ${HEAD_SHA} != current ${current}"
            exit 0
          fi
          if echo "$meta" | jq -e '[.labels[].name] | index("wip")' >/dev/null; then
            echo "wip label present; leave draft"
            exit 0
          fi
          # GITHUB_TOKEN cannot markPullRequestReadyForReview (GraphQL 403).
          # Do not fail CI: unit is the merge gate. The authoring agent runs `gh pr ready`.
          if gh pr ready "$PR_NUMBER" --repo "$REPO"; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(cat <<'EOF'
          `unit` is green, so this draft is now ready.

          Next: independent Bugbot review (read-only). GitHub Actions cannot start Cursor Bugbot. After a clean review, add `review-passed` to squash-merge.
          EOF
          )"
            exit 0
          fi
          echo "Actions cannot mark the PR ready; leaving a comment instead."
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(cat <<'EOF'
          `unit` is green. GitHub Actions cannot mark a draft ready (`GITHUB_TOKEN`).

          Next: `gh pr ready`, then independent Bugbot review (read-only). After a clean review, add `review-passed` to squash-merge.
          EOF
          )" || true
          exit 0
