name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -m "not integration"

  demo-api:
    name: demo-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Live DEMO public API
        run: pytest -m integration

  mark-ready:
    name: mark-ready
    needs: unit
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Mark the PR ready after green unit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          labels="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '[.labels[].name]')"
          if echo "$labels" | jq -e 'index("wip")' >/dev/null; then
            echo "wip label present; leave draft"
            exit 0
          fi
          gh pr ready "$PR_NUMBER" --repo "$REPO"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(cat <<'EOF'
          `unit` is green, so this draft is now ready.

          Next: independent Bugbot review (read-only). GitHub Actions cannot start Cursor Bugbot. After a clean review, add `review-passed` to squash-merge.
          EOF
          )"
