[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-bot"
version = "0.1.0"
description = "Kalshi DEMO Trade API client scaffold for Bitcoin 15-minute (KXBTC15M) markets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
  "duckdb>=1.1",
  "httpx>=0.27",
  "pyarrow>=15",
  "python-dotenv>=1.0",
  "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
discover-btc-15m = "kalshi_bot.cli:main"
record-kxbtc15m = "kalshi_bot.recorder:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: hits the live Kalshi DEMO public API",
]
