[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-bot"
version = "0.1.0"
description = "Kalshi live-data / paper-trade client for Bitcoin 15-minute (KXBTC15M) markets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
  "fastapi>=0.115",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "uvicorn>=0.32",
  "websockets>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
discover-btc-15m = "kalshi_bot.cli:main"
record-btc-15m = "kalshi_bot.cli:record_main"
dashboard-btc-15m = "kalshi_bot.cli:dashboard_main"
replay-btc-15m = "kalshi_bot.cli:replay_main"
paper-btc-15m = "kalshi_bot.cli:paper_main"

[tool.setuptools.package-data]
kalshi_bot = ["dashboard/static/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: hits the live Kalshi DEMO public API",
]
addopts = "-q"
